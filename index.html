<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#0b0710" />
<title>🕵️ 卧底风云 · 多人联机版</title>

<!--
  ============================================================
  🕵️ 卧底风云 · 多人联机版 (Firebase Realtime Database)

  📦 部署步骤：
    1. 访问 https://console.firebase.google.com/ 创建项目
    2. 在项目里创建 Realtime Database（创建时选择"测试模式"开启读写）
    3. 项目设置 → 你的应用 → 添加 Web 应用 → 复制 firebaseConfig
    4. 把下方 firebaseConfig 替换成你的真实配置
    5. 上传到 GitHub Pages / Netlify / Vercel / 任何静态托管

  🔓 测试模式安全规则（生产环境请加强）：
    {
      "rules": {
        ".read": true,
        ".write": true
      }
    }

  🎯 玩法：
    - 3-8 人输入相同房间号加入；每人输入自己的昵称
    - 房主可点 "🚀 开始游戏"（满 3 人才能开始）
    - 系统按在场人数分配卧底 (ceil(n/5) 个卧底)，平民剩余
    - 每人点自己的卡牌查看身份 → 然后每人对嫌疑人投 1 票（可改投）
    - 当得票最高的玩家，其票数 > 在场人数 / 2 时被票出 → 判定胜负
    - 卧底可随时输入 "🕵️ 间谍猜词"（平民无此权限）→ 猜中即胜
    - 永远只有自己的卡牌能翻开，他人卡牌对其他人都显示为 🔒 ???

  ============================================================
-->

<style>
/* ===== 基础重置 ===== */
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
  color: #f0f0ff;
  background: radial-gradient(ellipse at top, #1a1025 0%, #0b0710 100%);
  background-attachment: fixed;
  min-height: 100vh;
  overflow-x: hidden;
  position: relative;
}

/* 背景装饰光斑 */
body::before, body::after {
  content: "";
  position: fixed;
  width: 50vmax; height: 50vmax;
  border-radius: 50%;
  filter: blur(120px);
  opacity: .35;
  pointer-events: none;
  z-index: 0;
}
body::before { background: #6a3ec9; top: -15vmax; left: -15vmax; }
body::after  { background: #1e6dc9; bottom: -15vmax; right: -15vmax; }

.hidden { display: none !important; }
.screen { position: relative; z-index: 1; min-height: 100vh; padding: 20px 16px; }

/* ===== 加入房间界面 ===== */
.join-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
.join-card {
  width: 100%;
  max-width: 420px;
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.18);
  border-radius: 24px;
  padding: 36px 28px;
  text-align: center;
  box-shadow: 0 20px 60px rgba(0,0,0,0.6), 0 0 40px rgba(160,120,255,0.3);
}
.join-card h1 {
  font-size: clamp(32px, 7vw, 48px);
  letter-spacing: 2px;
  margin-bottom: 6px;
  text-shadow: 0 0 24px rgba(160, 120, 255, 0.7);
}
.join-card .subtitle {
  font-size: 14px;
  color: #b6b6d8;
  letter-spacing: 1px;
  margin-bottom: 22px;
}
.join-card input {
  width: 100%;
  background: rgba(0,0,0,0.35);
  border: 1px solid rgba(255,255,255,0.18);
  color: #fff;
  padding: 14px 18px;
  border-radius: 999px;
  font-size: 18px;
  text-align: center;
  letter-spacing: 2px;
  outline: none;
  transition: border-color .2s, box-shadow .2s;
  margin-bottom: 12px;
}
.join-card input:focus {
  border-color: rgba(160,120,255,0.7);
  box-shadow: 0 0 0 3px rgba(160,120,255,0.18);
}
.join-card .room-hint {
  font-size: 12px;
  color: #7a7a9c;
  margin: -6px 4px 6px;
  text-align: left;
}
.join-card .error {
  margin-top: 14px;
  color: #ff8888;
  font-size: 14px;
  min-height: 18px;
}

/* ===== 按钮 ===== */
.btn {
  cursor: pointer;
  border: 1px solid rgba(255,255,255,0.18);
  background: rgba(255,255,255,0.06);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  color: #f0f0ff;
  padding: 12px 22px;
  border-radius: 999px;
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 1px;
  transition: transform .15s ease, box-shadow .25s ease, background .25s ease;
  box-shadow: 0 0 14px rgba(120, 100, 220, 0.25);
  font-family: inherit;
}
.btn:hover:not(:disabled) { transform: translateY(-1px); background: rgba(255,255,255,0.12); }
.btn:active:not(:disabled) { transform: translateY(0); }
.btn:disabled { opacity: .35; cursor: not-allowed; }
.btn.primary {
  background: linear-gradient(135deg, #4c1d95, #6d28d9);
  border-color: transparent;
  width: 100%;
  padding: 14px;
  font-size: 17px;
  box-shadow: 0 0 22px rgba(120, 80, 220, 0.55);
}
.btn.orange { background: linear-gradient(135deg, #b45309, #f59e0b); border-color: transparent; }
.btn.reset { background: linear-gradient(135deg, #1ec97e, #1e6dc9); border-color: transparent; }
.btn.muted { background: rgba(120,80,220,0.15); border-color: rgba(160,120,255,0.35); }
.btn.muted.my-vote { background: rgba(255,224,112,0.18); border-color: rgba(255,224,112,0.55); color: #ffe070; }

/* ===== 顶部栏 ===== */
.topbar {
  max-width: 1100px;
  margin: 0 auto 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 16px;
  padding: 12px 18px;
  font-size: 14px;
  letter-spacing: 1px;
  flex-wrap: wrap;
  gap: 10px;
}
.topbar .room-info { color: #b6b6d8; }
.topbar .player-info {
  color: #ffe070;
  font-weight: 700;
  text-shadow: 0 0 12px rgba(255, 220, 100, 0.5);
}

/* ===== 卡牌 ===== */
.cards {
  max-width: 1100px;
  margin: 0 auto 18px;
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}
.cards.cols-3 { grid-template-columns: repeat(3, 1fr); }
.cards.cols-4 { grid-template-columns: repeat(4, 1fr); }
.cards.cols-5 { grid-template-columns: repeat(5, 1fr); }
.cards.cols-6 { grid-template-columns: repeat(6, 1fr); }
.cards.cols-7 { grid-template-columns: repeat(7, 1fr); }
.cards.cols-8 { grid-template-columns: repeat(8, 1fr); }
@media (max-width: 720px) {
  .cards,
  .cards.cols-3, .cards.cols-4, .cards.cols-5,
  .cards.cols-6, .cards.cols-7, .cards.cols-8 { grid-template-columns: repeat(4, 1fr); }
}
@media (max-width: 480px) {
  .cards,
  .cards.cols-3, .cards.cols-4, .cards.cols-5,
  .cards.cols-6, .cards.cols-7, .cards.cols-8 { grid-template-columns: repeat(3, 1fr); }
}

.card {
  position: relative;
  aspect-ratio: 2 / 3;
  min-height: 150px;
  perspective: 1000px;
  cursor: default;
}
.card.clickable { cursor: pointer; }
.card-inner {
  position: absolute; inset: 0;
  transform-style: preserve-3d;
  transition: transform .7s cubic-bezier(.4,.0,.2,1);
  border-radius: 16px;
}
.card.flipped .card-inner { transform: rotateY(180deg); }
.card-face {
  position: absolute; inset: 0;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  border-radius: 16px;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 10px;
  text-align: center;
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.18);
  box-shadow: 0 8px 32px rgba(0,0,0,0.4), inset 0 0 24px rgba(255,255,255,0.05);
}
.card-back {
  background: linear-gradient(135deg, rgba(120,80,220,0.18), rgba(30,109,201,0.18));
}
.card-back .emoji { font-size: clamp(30px, 6vw, 50px); margin-bottom: 4px; }
.card-back .label { font-size: clamp(12px, 2.6vw, 15px); color: #d0d0ff; letter-spacing: 1px; word-break: break-all; }
.card-back .hint  { font-size: 10px; color: #9999c8; margin-top: 4px; }

.card-front { transform: rotateY(180deg); color: #fff; font-weight: 700; }
.card-front.civilian { background: rgba(37, 99, 235, 0.85); border-color: rgba(100,180,255,0.5); }
.card-front.spy { background: rgba(220, 38, 38, 0.85); border-color: rgba(255,120,140,0.5); }
.card-front.locked {
  background: rgba(255,255,255,0.06);
  border-color: rgba(255,255,255,0.18);
  color: #8a8ab0;
  box-shadow: 0 8px 32px rgba(0,0,0,0.4);
}
.card-front.eliminated {
  background: rgba(120,120,140,0.35);
  border-color: rgba(255,80,80,0.55);
  color: #ffcfcf;
}

.card-front .role-tag {
  font-size: 12px; padding: 4px 10px;
  border-radius: 999px;
  background: rgba(0,0,0,0.25);
  margin-bottom: 8px;
  letter-spacing: 1px;
}
.card-front .word {
  font-size: clamp(15px, 3.5vw, 22px);
  word-break: break-all;
  line-height: 1.25;
}
.card-front.locked .word { font-size: clamp(20px, 5vw, 30px); color: #6a6a8c; }
.card-front .spy-icon { font-size: clamp(34px, 7vw, 50px); margin-bottom: 6px; }
.card-front .spy-text { font-size: clamp(12px, 2.8vw, 14px); }
.card-front .eliminated-tag {
  font-size: 11px; padding: 3px 8px;
  border-radius: 999px;
  background: rgba(220,38,38,0.4);
  border: 1px solid rgba(255,80,80,0.6);
  margin-top: 8px;
  letter-spacing: 1px;
}

/* 自己卡牌的金色高亮 */
.card.mine .card-back {
  border-color: rgba(255, 224, 112, 0.55);
  box-shadow: 0 8px 32px rgba(0,0,0,0.4), 0 0 18px rgba(255, 220, 100, 0.18), inset 0 0 24px rgba(255,255,255,0.05);
}
.card.mine .card-back .label { color: #ffe070; }

/* 票数小徽章 */
.card .vote-badge {
  position: absolute;
  top: 8px; right: 8px;
  min-width: 28px; height: 28px;
  padding: 0 8px;
  border-radius: 999px;
  background: linear-gradient(135deg, #f59e0b, #b45309);
  color: #fff;
  font-weight: 800;
  font-size: 13px;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 0 12px rgba(245,158,11,0.6);
  z-index: 4;
}

/* ===== 退出房间按钮 (在顶部栏) ===== */
.topbar-right { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.btn-leave {
  cursor: pointer;
  border: 1px solid rgba(255, 120, 140, 0.4);
  background: rgba(220, 38, 38, 0.18);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  color: #ff9aa8;
  padding: 6px 14px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 1px;
  transition: background .2s, transform .15s, color .2s;
  font-family: inherit;
}
.btn-leave:hover {
  background: rgba(220, 38, 38, 0.4);
  color: #fff;
  transform: translateY(-1px);
}
.btn-leave:active { transform: translateY(0); }

/* ===== 状态文字 ===== */
.status {
  max-width: 1100px;
  margin: 0 auto 14px;
  text-align: center;
  color: #b6b6d8;
  font-size: 14px;
  letter-spacing: 1px;
  min-height: 22px;
}

/* ===== 玩家列表（大厅） ===== */
.lobby-list {
  max-width: 600px;
  margin: 0 auto 18px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
  gap: 10px;
}
.lobby-tile {
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.18);
  border-radius: 14px;
  padding: 14px 8px;
  text-align: center;
  font-size: 13px;
  letter-spacing: 1px;
}
.lobby-tile.mine { border-color: rgba(255,224,112,0.55); color: #ffe070; }
.lobby-tile.empty { color: #5a5a7c; background: rgba(255,255,255,0.02); border-style: dashed; }

/* ===== 操作区 ===== */
.actions {
  max-width: 1100px;
  margin: 0 auto 16px;
  display: grid;
  grid-template-columns: 1.2fr 1fr;
  gap: 14px;
}
@media (max-width: 720px) { .actions { grid-template-columns: 1fr; } }
.panel {
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 18px;
  padding: 16px;
}
.panel h2 { color: #d8d8ff; font-size: 15px; margin-bottom: 10px; letter-spacing: 1px; }
.panel-hint {
  font-size: 12px; color: #9999c8;
  margin-top: 10px; line-height: 1.5;
}

.vote-row {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
  gap: 8px;
}
.vote-row .btn { padding: 9px 6px; font-size: 13px; }

.guess-row { display: flex; gap: 8px; }
.guess-row input {
  flex: 1; min-width: 0;
  background: rgba(0,0,0,0.35);
  border: 1px solid rgba(255,255,255,0.18);
  color: #fff;
  padding: 11px 14px;
  border-radius: 999px;
  font-size: 15px;
  outline: none;
  font-family: inherit;
}
.guess-row input:focus { border-color: rgba(160,120,255,0.7); box-shadow: 0 0 0 3px rgba(160,120,255,0.18); }
.guess-locked {
  text-align: center;
  padding: 28px 14px;
  color: #7a7a9c;
  font-size: 13px;
  line-height: 1.6;
  background: rgba(0,0,0,0.18);
  border-radius: 14px;
  border: 1px dashed rgba(255,255,255,0.08);
}

/* ===== 重置按钮 ===== */
.reset-area {
  max-width: 1100px;
  margin: 0 auto;
  text-align: center;
  display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;
}

/* ===== 结果弹窗 ===== */
.overlay {
  position: fixed; inset: 0;
  background: rgba(5, 5, 20, 0.7);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  display: flex; align-items: center; justify-content: center;
  z-index: 100;
  padding: 20px;
  animation: fadeIn .3s ease;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal {
  max-width: 400px; width: 100%;
  background: linear-gradient(135deg, rgba(40,20,80,0.92), rgba(20,40,90,0.92));
  border: 1px solid rgba(255,255,255,0.18);
  border-radius: 22px;
  padding: 28px 24px;
  text-align: center;
  box-shadow: 0 24px 64px rgba(0,0,0,0.6), 0 0 40px rgba(160,120,255,0.5);
  animation: pop .4s cubic-bezier(.2,.9,.3,1.2);
}
@keyframes pop { from { transform: scale(.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.modal .emoji { font-size: 56px; margin-bottom: 10px; }
.modal h3 {
  font-size: 24px; letter-spacing: 2px; margin-bottom: 8px;
  text-shadow: 0 0 16px rgba(160,120,255,0.6);
}
.modal.civilian-win h3 { color: #6fc3ff; }
.modal.spy-win h3 { color: #ff6f8c; }
.modal p { color: #c8c8e8; font-size: 14px; line-height: 1.6; margin-bottom: 14px; }
.modal .reveal {
  background: rgba(0,0,0,0.35);
  border-radius: 12px;
  padding: 12px;
  margin-bottom: 16px;
  font-size: 13px;
  color: #d8d8ff;
  text-align: left;
  line-height: 1.7;
}
.modal .reveal .word { color: #ffe070; font-weight: 700; font-size: 16px; }
.modal .reveal .spy-name { color: #ff9aa8; font-weight: 700; }
.modal .reveal .civilian-name { color: #93c5fd; font-weight: 700; }
.modal .modal-hint {
  margin-top: 10px !important;
  margin-bottom: 0 !important;
  font-size: 12px !important;
  color: #7a7a9c !important;
}

/* ===== 页脚 ===== */
footer {
  text-align: center;
  margin-top: 24px;
  color: #7a7a9c;
  font-size: 12px;
  letter-spacing: 1px;
}

/* ===== 房间内昵称/槽位预览 ===== */
.slot-summary {
  font-size: 12px; color: #9999c8;
  text-align: center; margin-top: 4px;
  letter-spacing: 1px;
}
</style>
</head>

<body>
  <!-- ========== 加入房间界面 ========== -->
  <div id="joinScreen" class="screen join-screen">
    <div class="join-card">
      <h1>🕵️ 卧底风云</h1>
      <p class="subtitle">多人联机 · 跨终端同步</p>
      <input id="nameInput" type="text" maxlength="8" placeholder="你的昵称 (≤8字)" autocomplete="off" />
      <input id="roomInput" type="text" inputmode="numeric"
             placeholder="房间号 (1-8 位数字)" maxlength="8" autocomplete="off" />
      <p class="room-hint">3 人即可开局，最多 8 人。先到的玩家成为房主可开局。</p>
      <button id="joinBtn" class="btn primary">🚀 加入 / 创建房间</button>
      <p id="joinError" class="error"></p>
    </div>
  </div>

  <!-- ========== 游戏界面 ========== -->
  <div id="gameScreen" class="screen hidden">
    <div class="topbar">
      <span class="room-info">🏠 房间 <span id="roomDisplay">----</span> · <span id="countDisplay">0/3</span></span>
      <div class="topbar-right">
        <span class="player-info">玩家 <span id="myPlayerDisplay">?</span></span>
        <button id="startBtn" class="btn orange" disabled>🚀 开始游戏</button>
        <button id="leaveBtn" class="btn-leave" title="退出房间">🚪 退出</button>
      </div>
    </div>

    <div id="lobbySection" class="hidden">
      <div class="lobby-list" id="lobbyList"></div>
      <p class="status" id="lobbyStatus">⌛ 等待玩家加入...</p>
      <div class="reset-area">
        <button id="startBtn2" class="btn primary" style="max-width: 320px;">🚀 满 3 人开始游戏</button>
      </div>
    </div>

    <div id="playSection" class="hidden">
      <div class="cards" id="cards"></div>
      <p class="status" id="status">准备中...</p>

      <div class="actions">
        <div class="panel">
          <h2>🗳️ 投票出卧底 <span id="voteMeta" class="slot-summary"></span></h2>
          <div class="vote-row" id="voteRow"></div>
          <p class="panel-hint">每人 1 票，可改投。得票数 <strong>超过</strong>在场人数一半的玩家会被票出并判定胜负。</p>
        </div>
        <div class="panel">
          <h2>🕵️ 间谍猜词</h2>
          <div id="guessArea"><!-- JS 渲染：卧底才能猜 / 平民看到 locked --></div>
          <p class="panel-hint">只有 <strong>卧底</strong> 才能猜词；猜中平民的词即胜。</p>
        </div>
      </div>

      <div class="reset-area">
        <button id="resetBtn" class="btn reset">🔄 再来一局</button>
        <button id="clearVoteBtn" class="btn muted">🧹 清空投票重新投</button>
      </div>

      <footer>👥 <strong>规则速览：</strong>3-8 人动态开局 · 每 5 人中 1 个卧底 · 投票需过半数才算出局 · 仅卧底可猜词</footer>
    </div>
  </div>

  <!-- ========== 结果弹窗 ========== -->
  <div id="overlay" class="overlay hidden">
    <div id="modal" class="modal">
      <div id="modalEmoji" class="emoji">🎉</div>
      <h3 id="modalTitle">平民胜利！</h3>
      <p id="modalDesc">你们成功揪出了间谍！</p>
      <div class="reveal" id="modalReveal">
        本局词语：<span class="word" id="modalWord">—</span><br/>
        间谍是：<strong id="modalSpy">玩家 ?</strong>
      </div>
      <button id="modalResetBtn" class="btn reset" style="margin-top: 4px;">🔄 再来一局</button>
      <p class="modal-hint">或点击弹窗外的空白处关闭</p>
    </div>
  </div>

  <!-- Firebase SDK (compat 版本, 保留 v8 namespaced API 写法) -->
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>

  <script>

  const firebaseConfig = {
    apiKey: "AIzaSy…8uwA",
    authDomain: "planning-with-ai-32943.firebaseapp.com",
    databaseURL: "https://planning-with-ai-32943-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "planning-with-ai-32943",
    storageBucket: "planning-with-ai-32943.firebasestorage.app",
    messagingSenderId: "287142960547",
    appId: "1:287142960547:web:55c129c85e83d17a430e16"
  };

  // 初始化 Firebase
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  // ============================================================
  // 常量与词库
  // ============================================================
  const MIN_PLAYERS  = 3;
  const MAX_PLAYERS  = 8;
  const WORDS = [
    "苹果","香蕉","橙子","葡萄","西瓜","草莓",
    "猫","狗","兔子","熊猫","老虎","狮子",
    "手机","电脑","耳机","钥匙","钱包","眼镜",
    "学校","医院","公园","图书馆","电影院","博物馆",
    "钢琴","吉他","足球","篮球","羽毛球","乒乓球",
    "饺子","火锅","烧烤","汉堡","寿司","披萨",
    "太阳","月亮","星星","雨伞","蜡烛","枕头"
  ];

  // ============================================================
  // 全局状态
  // ============================================================
  let currentRoomId  = null;
  let myPlayerIndex  = null;
  let myName         = "";
  let roomData       = null;
  let dismissedResult= false;  // 本轮投票结果是否已被点掉（用于防止弹窗反复刷出）

  // ============================================================
  // DOM 引用
  // ============================================================
  const $joinScreen     = document.getElementById("joinScreen");
  const $gameScreen     = document.getElementById("gameScreen");
  const $nameInput      = document.getElementById("nameInput");
  const $roomInput      = document.getElementById("roomInput");
  const $joinBtn        = document.getElementById("joinBtn");
  const $joinError      = document.getElementById("joinError");
  const $roomDisplay    = document.getElementById("roomDisplay");
  const $myPlayer       = document.getElementById("myPlayerDisplay");
  const $countDisplay   = document.getElementById("countDisplay");
  const $startBtn       = document.getElementById("startBtn");
  const $startBtn2      = document.getElementById("startBtn2");
  const $lobbySection   = document.getElementById("lobbySection");
  const $lobbyList      = document.getElementById("lobbyList");
  const $lobbyStatus    = document.getElementById("lobbyStatus");
  const $playSection    = document.getElementById("playSection");
  const $cards          = document.getElementById("cards");
  const $status         = document.getElementById("status");
  const $voteRow        = document.getElementById("voteRow");
  const $voteMeta       = document.getElementById("voteMeta");
  const $guessArea      = document.getElementById("guessArea");
  const $resetBtn       = document.getElementById("resetBtn");
  const $clearVoteBtn   = document.getElementById("clearVoteBtn");
  const $leaveBtn       = document.getElementById("leaveBtn");
  const $overlay        = document.getElementById("overlay");
  const $modal          = document.getElementById("modal");
  const $modalEmoji     = document.getElementById("modalEmoji");
  const $modalTitle     = document.getElementById("modalTitle");
  const $modalDesc      = document.getElementById("modalDesc");
  const $modalWord      = document.getElementById("modalWord");
  const $modalSpy       = document.getElementById("modalSpy");
  const $modalResetBtn  = document.getElementById("modalResetBtn");

  // ============================================================
  // 工具函数
  // ============================================================
  function escapeHtml(s) {
    return String(s ?? "").replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }
  function pickWord() { return WORDS[Math.floor(Math.random() * WORDS.length)]; }
  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }
  function activePlayersList(room) {
    // 返回在场玩家的索引数组（按座位号升序）
    const list = [];
    (room.players || []).forEach((p, i) => { if (p && p.present) list.push(i); });
    return list;
  }
  function playerName(room, i) {
    const p = (room.players || [])[i];
    return (p && p.name) ? p.name : `玩家 ${i + 1}`;
  }
  function spyCountByN(n) {
    // ceil(n/5): 3→1, 4→1, 5→1, 6→2, ..., 10→2, 11→3
    // 保证 ≥3 人也至少有 1 个卧底
    return Math.max(1, Math.ceil(n / 5));
  }

  // ============================================================
  // 加入房间
  // ============================================================
  async function joinRoom() {
    const name = $nameInput.value.trim();
    const raw  = $roomInput.value.trim();
    $joinError.textContent = "";
    if (!name) { $joinError.textContent = "请输入你的昵称"; return; }
    if (name.length > 8) { $joinError.textContent = "昵称最多 8 个字"; return; }
    if (!raw)   { $joinError.textContent = "请输入房间号"; return; }
    if (!/^\d{1,8}$/.test(raw)) { $joinError.textContent = "房间号只能为数字 (1-8 位)"; return; }

    $joinBtn.disabled = true;
    $joinBtn.textContent = "⏳ 连接中...";

    try {
      await claimSlot(raw, name);
      // 成功后保存 + 进入
      localStorage.setItem("uc_room", raw);
      localStorage.setItem("uc_player", String(myPlayerIndex));
      localStorage.setItem("uc_name", name);
      enterGame();
    } catch (e) {
      $joinError.textContent = e.message || "网络错误，请重试";
      $joinBtn.disabled = false;
      $joinBtn.textContent = "🚀 加入 / 创建房间";
    }
  }

  async function claimSlot(roomId, name) {
    const roomRef = db.ref(`rooms/${roomId}`);
    const snap = await roomRef.once("value");
    const data = snap.val();

    // 已存在房间 & 游戏进行中 → 不准加入
    if (data && data.started && !data.gameOver) {
      throw new Error("游戏进行中，无法加入");
    }

    let players;
    let myIndex;

    if (!data) {
      // 全新房间 → 创建者
      myIndex = 0;
      players = new Array(MAX_PLAYERS).fill(null).map((_, i) => ({
        present: i === 0, name: i === 0 ? name : ""
      }));
      await roomRef.set({
        players,
        maxPlayers: MAX_PLAYERS,
        started:   false,
        gameOver:  false,
        winner:    null,
        word:      "",
        spyIndices:    [],
        civilianIndices:[],
        flipped:   new Array(MAX_PLAYERS).fill(false),
        votes:     {},
        createdAt: firebase.database.ServerValue.TIMESTAMP
      });
    } else {
      // 旧房间（可能 gameOver=true，可以重启）→ 找空位
      players = [...(data.players || new Array(MAX_PLAYERS).fill({ present: false, name: "" }))];
      // 补齐到 MAX_PLAYERS
      while (players.length < MAX_PLAYERS) {
        players.push({ present: false, name: "" });
      }
      myIndex = players.findIndex(p => !p || !p.present);
      if (myIndex === -1) throw new Error("房间已满 (最多 8 人)");

      players[myIndex] = { present: true, name };

      // 游戏已结束的房间，新人加入时如果还有人在等 → 把 started 重置回 false
      // （如果所有人都还在场则继续上局也行，但为简化，直接让房主重新开局）
      await roomRef.update({
        players,
        started: false  // 强制回大厅
      });
    }

    myName = name;
    myPlayerIndex = myIndex;
    currentRoomId = roomId;
  }

  // ============================================================
  // 重新加入（页面刷新后恢复）
  // ============================================================
  async function tryRejoin() {
    const savedRoom   = localStorage.getItem("uc_room");
    const savedPlayer = localStorage.getItem("uc_player");
    const savedName   = localStorage.getItem("uc_name") || "";
    if (!savedRoom || savedPlayer === null) return false;

    try {
      const snap = await db.ref(`rooms/${savedRoom}`).once("value");
      const data = snap.val();
      if (!data || !data.players || !data.players[parseInt(savedPlayer)] || !data.players[parseInt(savedPlayer)].present) {
        // 位置已空, 清理
        localStorage.removeItem("uc_room");
        localStorage.removeItem("uc_player");
        localStorage.removeItem("uc_name");
        return false;
      }
      // 如果名字为空（升级前存的旧 localStorage），用本地保存的名字补一下
      const stored = data.players[parseInt(savedPlayer)];
      if (savedName && !stored.name) {
        await db.ref(`rooms/${savedRoom}/players/${parseInt(savedPlayer)}/name`).set(savedName);
      }
      currentRoomId = savedRoom;
      myPlayerIndex = parseInt(savedPlayer);
      myName = stored.name || savedName || `玩家 ${myPlayerIndex + 1}`;
      enterGame();
      return true;
    } catch (e) {
      return false;
    }
  }

  function enterGame() {
    $joinScreen.classList.add("hidden");
    $gameScreen.classList.remove("hidden");
    $roomDisplay.textContent = currentRoomId;
    $myPlayer.textContent = myName || `玩家 ${myPlayerIndex + 1}`;
    listenRoom();
  }

  // ============================================================
  // 实时监听房间数据
  // ============================================================
  function listenRoom() {
    db.ref(`rooms/${currentRoomId}`).on("value", (snap) => {
      roomData = snap.val();
      if (roomData) render();
    });
  }

  // ============================================================
  // 渲染
  // ============================================================
  function render() {
    renderSections();
    renderLobby();
    renderCards();
    renderStatus();
    renderControls();
    renderResult();
    // 投票结算钩子: 数据稳定后, 检测"所有人都投了"则触发自动结算
    if (roomData && roomData.started && !roomData.gameOver) {
      const votes = roomData.votes || {};
      const active = activePlayersList(roomData);
      if (active.length >= MIN_PLAYERS && active.every(i => Object.prototype.hasOwnProperty.call(votes, i))) {
        clearTimeout(window.__voteTimer);
        window.__voteTimer = setTimeout(maybeFinalizeVote, 150);
      }
    }
  }

  function renderSections() {
    const started = !!roomData.started;
    $lobbySection.classList.toggle("hidden",  started);
    $playSection.classList.toggle("hidden", !started);
  }

  // 大厅: 槽位列表 + "开始游戏"按钮可用性
  function renderLobby() {
    const players = roomData.players || [];
    const presentCount = players.filter(p => p && p.present).length;
    const minNeeded = Math.max(0, MIN_PLAYERS - presentCount);
    $countDisplay.textContent = `${presentCount}/${MIN_PLAYERS}+`;

    $lobbyList.innerHTML = "";
    for (let i = 0; i < MAX_PLAYERS; i++) {
      const p = players[i];
      const occupied = !!(p && p.present);
      const isMine = (i === myPlayerIndex);
      const tile = document.createElement("div");
      tile.className = "lobby-tile" + (occupied ? (isMine ? " mine" : "") : " empty");
      tile.innerHTML = occupied ? `🎴 ${escapeHtml(p.name || ("玩家 " + (i + 1)))}` : `+ 空位 ${i + 1}`;
      $lobbyList.appendChild(tile);
    }

    const iAmFirstPlayer = (myPlayerIndex === 0);
    const canStart = presentCount >= MIN_PLAYERS;

    const hint = presentCount < MIN_PLAYERS
      ? `⌛ 还需要 ${minNeeded} 人加入才能开始`
      : `✅ 已达 ${presentCount} 人，可开始游戏`;
    $lobbyStatus.textContent = hint;
    $lobbyStatus.style.color = canStart ? "#86efac" : "#b6b6d8";

    $startBtn.disabled  = !canStart;
    $startBtn.textContent = canStart ? "🚀 开始游戏" : `⌛ 等待 ${minNeeded} 人`;
    $startBtn.title = canStart ? "你是房主也可开局" : "至少 3 人才可开始";

    $startBtn2.disabled = !canStart;
    $startBtn2.textContent = canStart
      ? `🚀 开始游戏 (${presentCount} 人在场)`
      : `⌛ 还差 ${minNeeded} 人开始`;
  }

  // 渲染卡牌（隐私版）
  function renderCards() {
    if (!roomData || !roomData.started) return;
    const players = roomData.players || [];
    const active = activePlayersList(roomData);
    const N = active.length;

    // 动态调整列数（CSS 类）
    const desired = Math.min(8, Math.max(3, N));
    $cards.className = "cards cols-" + desired;

    $cards.innerHTML = "";
    const isGameOver = !!roomData.gameOver;
    const flipped    = roomData.flipped || new Array(MAX_PLAYERS).fill(false);
    const votes      = roomData.votes || {};
    const spySet     = new Set(roomData.spyIndices || []);
    const tally = computeTally(votes);
    const eliminatedIdx = (isGameOver && tally && tally.eliminated != null) ? tally.eliminated : null;

    for (const i of active) {
      const isMine   = (i === myPlayerIndex);
      const iFlipped = !!flipped[i];
      const isSpy    = spySet.has(i);
      const canSeeContent = isGameOver || (isMine && iFlipped);
      const wasEliminated = (eliminatedIdx === i);

      const card = document.createElement("div");
      card.className = "card" +
                       (canSeeContent ? " flipped" : "") +
                       (isMine ? " mine" : "") +
                       ((isMine && !isGameOver && !iFlipped) ? " clickable" : "");
      card.dataset.idx = i;
      const showVoteBadge = (tally && tally.counts[i] > 0) && !isGameOver;
      const voteCount = tally ? (tally.counts[i] || 0) : 0;

      let frontCls, frontInner;
      if (canSeeContent) {
        frontCls = (wasEliminated ? "eliminated " : "") + (isSpy ? "spy" : "civilian");
        frontInner = isSpy
          ? `<div class="spy-icon">🕵️</div>
             <div class="role-tag">间谍</div>
             <div class="spy-text">空纸条</div>
             ${wasEliminated ? `<div class="eliminated-tag">已被票出</div>` : ""}`
          : `<div class="role-tag">平民</div>
             <div class="word">${escapeHtml(roomData.word)}</div>
             ${wasEliminated ? `<div class="eliminated-tag">已被票出</div>` : ""}`;
      } else {
        frontCls = "locked";
        frontInner = `<div class="role-tag">🔒</div>
                      <div class="word">???</div>`;
      }

      let hint;
      if (isGameOver)        hint = "已结束";
      else if (isMine)       hint = iFlipped ? "已查阅 ✓" : "点击翻开";
      else                   hint = "私密";

      card.innerHTML = `
        <div class="card-inner">
          <div class="card-face card-back">
            <div class="emoji">🎴</div>
            <div class="label">${escapeHtml(playerName(roomData, i))}${isMine ? " (你)" : ""}</div>
            <div class="hint">${hint}</div>
          </div>
          <div class="card-face card-front ${frontCls}">
            ${frontInner}
          </div>
        </div>
        ${showVoteBadge ? `<div class="vote-badge" title="得票数">${voteCount}</div>` : ""}
      `;

      if (isMine && !isGameOver && !iFlipped) {
        card.addEventListener("click", () => onCardClick(i));
      }
      $cards.appendChild(card);
    }
  }

  function renderStatus() {
    if (!roomData) return;
    if (!roomData.started) return; // 大厅状态由 renderLobby 处理

    if (roomData.gameOver) {
      const cw = roomData.winner === "civilian";
      $status.textContent = cw ? "🎉 平民胜利！" : "💀 间谍胜利！";
      $status.style.color = cw ? "#6fc3ff" : "#ff6f8c";
      return;
    }

    const active = activePlayersList(roomData);
    const N = active.length;
    const flippedAll = active.every(i => (roomData.flipped || [])[i]);
    const votes = roomData.votes || {};
    const votedCount = active.filter(i => Object.prototype.hasOwnProperty.call(votes, i)).length;

    if (!flippedAll) {
      $status.textContent = `👆 请所有玩家点击自己的卡牌查看身份 (${active.filter(i => (roomData.flipped || [])[i]).length}/${N})`;
      $status.style.color = "#b6b6d8";
    } else if (votedCount < N) {
      $status.textContent = `🗳️ 投票进行中 (${votedCount}/${N}) · 得票数 > ${(N / 2).toFixed(1)} 才算出局`;
      $status.style.color = "#b6b6d8";
    } else {
      $status.textContent = "📊 投票完成，等待结算中…";
      $status.style.color = "#b6b6d8";
    }
  }

  function renderControls() {
    if (!roomData || !roomData.started) return;
    const active = activePlayersList(roomData);
    const N = active.length;
    const isGameOver = !!roomData.gameOver;

    if (isGameOver) {
      // 游戏结束，所有投票/猜词按钮禁用
      $voteRow.querySelectorAll(".btn").forEach(b => b.disabled = true);
      disableGuess(true);
      $resetBtn.disabled = false;
      $clearVoteBtn.disabled = true;
      return;
    }

    // 投票按钮：动态生成（按在场人数）
    $voteRow.innerHTML = "";
    const votes = roomData.votes || {};
    const myVote = votes[myPlayerIndex];
    const flippedAll = active.every(i => (roomData.flipped || [])[i]);
    const canVote = flippedAll;

    for (const i of active) {
      if (i === myPlayerIndex) continue;  // 不能投自己
      const btn = document.createElement("button");
      btn.className = "btn muted" + (myVote === i ? " my-vote" : "");
      btn.textContent = (myVote === i ? "✓ " : "") + "投 " + playerName(roomData, i);
      btn.disabled = !canVote;
      btn.addEventListener("click", () => doVote(i));
      $voteRow.appendChild(btn);
    }

    const votedCount = active.filter(i => Object.prototype.hasOwnProperty.call(votes, i)).length;
    $voteMeta.textContent = `· 已投 ${votedCount}/${N}`;

    disableGuess(false);
    $resetBtn.disabled = false;
    // 当所有人都投完时显示清空投票按钮, 否则隐藏
    $clearVoteBtn.disabled = !(votedCount >= N);
  }

  function disableGuess(forced) {
    const isSpy = (roomData.spyIndices || []).includes(myPlayerIndex);
    const isGameOver = !!(roomData && roomData.gameOver);
    const existingInput = document.getElementById("guessInput");

    if (isSpy && !isGameOver) {
      // 如果已经存在 input, 只切换 disabled 状态 (避免打字中途失焦)
      if (existingInput) {
        const btn = document.getElementById("guessBtn");
        if (btn) btn.disabled = !!forced;
        existingInput.disabled = !!forced;
        return;
      }
      $guessArea.innerHTML = `
        <div class="guess-row">
          <input type="text" id="guessInput" placeholder="间谍输入猜测的词语…" maxlength="20" autocomplete="off" />
          <button id="guessBtn" class="btn orange">猜！</button>
        </div>
      `;
      document.getElementById("guessBtn").addEventListener("click", spyGuess);
      const inp = document.getElementById("guessInput");
      inp.addEventListener("keydown", e => { if (e.key === "Enter") spyGuess(); });
      if (forced) {
        document.getElementById("guessBtn").disabled = true;
        inp.disabled = true;
      }
    } else if (isGameOver) {
      if (!existingInput) {
        $guessArea.innerHTML = `<div class="guess-locked">— 游戏已结束 —</div>`;
      }
    } else {
      // 平民：不可猜词
      if (!existingInput) {
        $guessArea.innerHTML = `
          <div class="guess-locked">🔒 只有 <strong>卧底</strong> 才能猜词<br/><span style="font-size:11px;color:#6a6a8c;">平民请通过投票把卧底票出局</span></div>
        `;
      }
    }
  }

  // 票数统计
  function computeTally(votes) {
    const counts = {};
    if (votes) {
      for (const target of Object.values(votes)) {
        counts[target] = (counts[target] || 0) + 1;
      }
    }
    return { counts };
  }

  // 投票结算判定: 得票最多者 > n/2 才出局
  function judgeTally(tally, n) {
    if (!tally) return null;
    const entries = Object.entries(tally.counts).filter(([, c]) => c > 0);
    if (entries.length === 0) return null;
    entries.sort((a, b) => b[1] - a[1]);
    const [topTarget, topCount] = entries[0];
    const threshold = n / 2;
    // 平票 (topCount === secondCount) 视为无果
    const isTie = entries.length > 1 && entries[1][1] === topCount;
    if (isTie) return { tied: true, threshold, topCount, topTarget: parseInt(topTarget, 10) };
    if (topCount > threshold) return {
      eliminated: parseInt(topTarget, 10),
      threshold,
      topCount,
      tied: false
    };
    return { eliminated: null, threshold, topCount, topTarget: parseInt(topTarget, 10), tied: false };
  }

  // 渲染结果弹窗
  function renderResult() {
    if (!roomData) return;
    if (!roomData.started) {
      $overlay.classList.add("hidden");
      dismissedResult = false;
      return;
    }

    // 游戏刚结束 (gameOver=true) → 弹模态框
    if (roomData.gameOver) {
      // 从 roomData 直接拿结果 (由 startVote 写进去)
      const winner = roomData.winner;  // "civilian" | "spy" | null
      let eliminatedName = "";
      let mode = roomData.endMode || "vote";
      if (winner) {
        const data = roomData.endData || {};
        if (data.eliminated != null) {
          eliminatedName = playerName(roomData, data.eliminated);
        } else if (mode === "spyGuess") {
          eliminatedName = "无（间谍盲猜失败）";
        } else if (mode === "noEliminate") {
          eliminatedName = "（无人得票过半）";
        }
        showResultModal(winner, mode, eliminatedName, data);
      }
    } else {
      // 在游戏中: 实时结算（所有人都投了，但还没超过半数 → "投票无效，继续"）
      // 由后台 watcher 在 everyoneVoted 时主动调 tryFinalizeVote，不再依赖状态变更弹窗
      $overlay.classList.add("hidden");
      dismissedResult = false;
    }
  }

  function showResultModal(winner, mode, eliminatedName, data) {
    const civilianWin = winner === "civilian";
    $modal.className = "modal " + (civilianWin ? "civilian-win" : "spy-win");

    let title, desc, emoji;
    if (mode === "spyGuess") {
      // 间谍猜词决定胜负
      if (winner === "spy") {
        emoji = "💀"; title = "间谍胜利！";
        desc = "卧底猜中了平民手里的词，绝地翻盘！";
      } else {
        emoji = "🎉"; title = "平民胜利！";
        desc = "间谍猜错了词，身份暴露！";
      }
    } else if (mode === "noEliminate") {
      // 投票无效, 但仍然结束了 — 默认判定间谍赢（无人被票出）
      emoji = "💀"; title = "间谍胜利！";
      desc = data && data.tied
        ? "出现平票，没人被票出，间谍成功潜伏。"
        : "没人得票过半，间谍成功潜伏。";
    } else {
      // 正常投票出局
      emoji = civilianWin ? "🎉" : "💀";
      title = civilianWin ? "平民胜利！" : "间谍胜利！";
      const wasSpy = (roomData.spyIndices || []).includes(data.eliminated);
      if (wasSpy) {
        desc = `你们成功揪出了间谍 (${eliminatedName})，平民词保住了！`;
      } else {
        desc = `很遗憾，${eliminatedName} 是被冤票的平民，间谍隐藏在了你们当中。`;
      }
    }

    $modalEmoji.textContent = emoji;
    $modalTitle.textContent = title;
    $modalDesc.textContent  = desc;

    // 词语 + 卧底名字列表
    const spyIndices = roomData.spyIndices || [];
    const spyNames   = spyIndices.map(i => playerName(roomData, i)).join("、");
    $modalReveal.innerHTML = `
      本局词语：<span class="word">${escapeHtml(roomData.word)}</span><br/>
      平民人数：${(roomData.players || []).filter(p => p && p.present).length - spyIndices.length} 人<br/>
      卧底是：<strong class="spy-name">${escapeHtml(spyNames || "未知")}</strong>
    `;
    $overlay.classList.remove("hidden");
  }

  // ============================================================
  // 交互处理
  // ============================================================

  /** 翻牌：只能翻自己的牌 */
  async function onCardClick(idx) {
    if (!roomData || !roomData.started || roomData.gameOver) return;
    if (idx !== myPlayerIndex) return;
    const flipped = [...(roomData.flipped || new Array(MAX_PLAYERS).fill(false))];
    if (flipped[idx]) return;
    flipped[idx] = true;
    await db.ref(`rooms/${currentRoomId}/flipped`).set(flipped);
  }

  /** 投票（含改票） */
  async function doVote(target) {
    if (!roomData || !roomData.started || roomData.gameOver) return;
    const updates = {};
    updates[`votes/${myPlayerIndex}`] = target;
    await db.ref(`rooms/${currentRoomId}`).update(updates);
    // 改票结束后, 检查是否所有人都投了
    await maybeFinalizeVote();
  }

  /** 清空所有票, 重新投 */
  async function clearAllVotes() {
    if (!currentRoomId) return;
    if (!confirm("确认清空所有票，让所有人重新投一次？")) return;
    await db.ref(`rooms/${currentRoomId}/votes`).remove();
  }

  /** 监听投票变化: 当所有人都投了, 触发结算 */
  async function maybeFinalizeVote() {
    if (!roomData || !roomData.started || roomData.gameOver) return;
    const active = activePlayersList(roomData);
    const N = active.length;
    const votes = roomData.votes || {};
    const votedCount = active.filter(i => Object.prototype.hasOwnProperty.call(votes, i)).length;
    if (votedCount < N) return;
    const flippedAll = active.every(i => (roomData.flipped || [])[i]);
    if (!flippedAll) return;

    const tally = computeTally(votes);
    const verdict = judgeTally(tally, N);

    if (verdict && verdict.eliminated != null) {
      // 出局结算
      const wasSpy = (roomData.spyIndices || []).includes(verdict.eliminated);
      await db.ref(`rooms/${currentRoomId}`).update({
        gameOver: true,
        winner:   wasSpy ? "civilian" : "spy",
        endMode:  "vote",
        endData:  { eliminated: verdict.eliminated, threshold: verdict.threshold, topCount: verdict.topCount }
      });
    } else if (verdict && verdict.tied) {
      // 平票: 自动清空票重新投（无需弹确认）
      await db.ref(`rooms/${currentRoomId}/votes`).remove();
      // 提示
      alert("出现平票，请重新投票！");
    } else {
      // 没人得票过半: 直接判间谍胜
      await db.ref(`rooms/${currentRoomId}`).update({
        gameOver: true,
        winner:   "spy",
        endMode:  "noEliminate",
        endData:  verdict || {}
      });
    }
  }

  /** 间谍猜词 */
  async function spyGuess() {
    if (!roomData || roomData.gameOver) return;
    const isSpy = (roomData.spyIndices || []).includes(myPlayerIndex);
    if (!isSpy) { alert("只有卧底才能猜词"); return; }
    const inp = document.getElementById("guessInput");
    if (!inp) return;
    const guess = inp.value.trim();
    if (!guess) { alert("请先输入猜测的词语～"); return; }
    const isWin = (guess === roomData.word);
    await db.ref(`rooms/${currentRoomId}`).update({
      gameOver: true,
      winner:   isWin ? "spy" : "civilian",
      endMode:  "spyGuess",
      endData:  { guess }
    });
  }

  /** 开始游戏：分配角色 */
  async function startGame() {
    if (!currentRoomId || !roomData) return;
    const active = activePlayersList(roomData);
    const n = active.length;
    if (n < MIN_PLAYERS) return;
    const spyN = spyCountByN(n);
    const shuffled = shuffle([...active]);
    const spyIndices      = shuffled.slice(0, spyN);
    const civilianIndices = shuffled.slice(spyN);
    const word = pickWord();
    await db.ref(`rooms/${currentRoomId}`).update({
      started:       true,
      gameOver:      false,
      winner:        null,
      endMode:       null,
      endData:       null,
      word,
      spyIndices,
      civilianIndices,
      flipped:       new Array(MAX_PLAYERS).fill(false),
      votes:         {}
    });
  }

  /** 再来一局 */
  async function resetGame() {
    if (!currentRoomId || !roomData) return;
    const active = activePlayersList(roomData);
    if (active.length < MIN_PLAYERS) {
      // 人不够, 退回大厅
      await db.ref(`rooms/${currentRoomId}`).update({
        started: false, gameOver: false, winner: null, votes: {}, flipped: new Array(MAX_PLAYERS).fill(false)
      });
      return;
    }
    const n = active.length;
    const spyN = spyCountByN(n);
    const shuffled = shuffle([...active]);
    const spyIndices      = shuffled.slice(0, spyN);
    const civilianIndices = shuffled.slice(spyN);
    const word = pickWord();
    await db.ref(`rooms/${currentRoomId}`).update({
      started:       true,
      gameOver:      false,
      winner:        null,
      endMode:       null,
      endData:       null,
      word,
      spyIndices,
      civilianIndices,
      flipped:       new Array(MAX_PLAYERS).fill(false),
      votes:         {}
    });
    const inp = document.getElementById("guessInput");
    if (inp) inp.value = "";
    $overlay.classList.add("hidden");
  }

  /** 退出房间 */
  async function leaveRoom() {
    if (!currentRoomId || myPlayerIndex === null) {
      $gameScreen.classList.add("hidden");
      $joinScreen.classList.remove("hidden");
      $roomInput.value = "";
      $joinBtn.disabled = false;
      $joinBtn.textContent = "🚀 加入 / 创建房间";
      return;
    }

    db.ref(`rooms/${currentRoomId}`).off("value");

    try {
      const players = [...(roomData.players || new Array(MAX_PLAYERS).fill({ present: false, name: "" }))];
      while (players.length < MAX_PLAYERS) players.push({ present: false, name: "" });
      if (myPlayerIndex >= 0 && myPlayerIndex < MAX_PLAYERS) {
        players[myPlayerIndex] = { present: false, name: "" };
      }
      const stillPresent = players.some(p => p && p.present);
      if (!stillPresent) {
        await db.ref(`rooms/${currentRoomId}`).remove();
      } else {
        // 只更新自己位置
        await db.ref(`rooms/${currentRoomId}/players/${myPlayerIndex}`).set({ present: false, name: "" });
        // 如果游戏在进行中, 退出后大家继续 (数据保留); 但 endMode 不需特殊处理
      }
    } catch (e) { /* ignore */ }

    localStorage.removeItem("uc_room");
    localStorage.removeItem("uc_player");
    localStorage.removeItem("uc_name");
    currentRoomId = null;
    myPlayerIndex = null;
    myName = "";
    roomData = null;
    dismissedResult = false;

    $overlay.classList.add("hidden");
    $gameScreen.classList.add("hidden");
    $joinScreen.classList.remove("hidden");
    $roomInput.value = "";
    $joinBtn.disabled = false;
    $joinBtn.textContent = "🚀 加入 / 创建房间";
  }

  // ============================================================
  // 事件绑定
  // ============================================================
  $joinBtn.addEventListener("click", joinRoom);
  $roomInput.addEventListener("keydown", e => { if (e.key === "Enter") joinRoom(); });
  $nameInput.addEventListener("keydown",  e => { if (e.key === "Enter") $roomInput.focus(); });
  $startBtn.addEventListener("click", startGame);
  $startBtn2.addEventListener("click", startGame);
  $resetBtn.addEventListener("click", resetGame);
  $clearVoteBtn.addEventListener("click", clearAllVotes);
  $leaveBtn.addEventListener("click", () => {
    if (confirm("确定要退出当前房间吗？")) leaveRoom();
  });

  $modalResetBtn.addEventListener("click", resetGame);

  // 点空白关闭弹窗，但不重置游戏
  $overlay.addEventListener("click", (e) => {
    if (e.target === $overlay) $overlay.classList.add("hidden");
  });

  // ============================================================
  // 页面加载
  // ============================================================
  window.addEventListener("DOMContentLoaded", () => {
    tryRejoin();
  });
  </script>
</body>
</html>
